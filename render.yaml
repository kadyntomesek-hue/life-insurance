# Render Blueprint: New + -> Blueprint -> pick this repo. A persistent disk needs a paid instance (Starter).
services:
  - type: web
    name: life-insurance-crm
    runtime: docker
    plan: starter
    healthCheckPath: /api/auth/status
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
