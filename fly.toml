# Fly.io: `fly launch --copy-config --no-deploy`, then `fly volumes create data --size 1`, then `fly deploy`.
app = "life-insurance-crm"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  PORT = "3000"
  COOKIE_SECURE = "true"
  TRUST_PROXY = "1"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/api/auth/status"
